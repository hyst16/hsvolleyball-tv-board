name: Update Volleyball Schedules & README

on:
  workflow_dispatch:
  
  schedule:
    # 6:15 AM Central every day
    - cron: "15 11 * * *"

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NSAA Scraper
        run: |
          python scraper/scrape_nsaa_volleyball.py

      - name: Update README from teams.json
        run: |
          python update_readme.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/volleyball.json README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(volleyball): update schedules and README"
            git push
          fi
